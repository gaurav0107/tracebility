# Langprobe operator deployment.
#
# Deploys the operator into a cluster-wide service account so it can
# manage Deployments / Services / Ingress / PVCs in any namespace
# that hosts a Langprobe CR. Tighten the ClusterRole to specific
# namespaces if your security posture demands it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: langprobe-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langprobe-operator
  namespace: langprobe-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: langprobe-operator
# Least privilege: concrete verbs only (no wildcards), and NO access to
# `secrets`. The reconciler renders `secretKeyRef` env entries into pod
# specs (resolved by the kubelet); it never calls the Secret API, so a
# cluster-wide secrets read grant would only widen the blast radius of a
# compromised operator token without being used. For a tighter posture,
# convert this ClusterRole to namespaced Roles scoped to the namespaces
# that host a Langprobe CR.
rules:
  - apiGroups: ["langprobe.io"]
    resources: ["tracebilities", "tracebilities/status", "tracebilities/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    # kopf posts progress/error events on the objects it manages.
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: langprobe-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: langprobe-operator
subjects:
  - kind: ServiceAccount
    name: langprobe-operator
    namespace: langprobe-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langprobe-operator
  namespace: langprobe-system
  labels:
    app.kubernetes.io/name: langprobe-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langprobe-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langprobe-operator
    spec:
      serviceAccountName: langprobe-operator
      containers:
        - name: operator
          image: ghcr.io/langprobe/langprobe-operator:latest
          command: ["kopf", "run", "-A", "-m", "langprobe_operator.main", "--standalone"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
