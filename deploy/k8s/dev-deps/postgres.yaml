---
# In-cluster Postgres for the GKE deploy. Runs as a StatefulSet with a
# PersistentVolumeClaim so the data survives pod restarts / rescheduling —
# on GKE Autopilot pods are recreated routinely (node auto-repair,
# bin-packing, upgrades), and an emptyDir would silently lose every table
# on each move. See README.md for the managed-database migration path.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: langprobe
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: dev-deps
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: dev-deps
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: langprobe
            - name: POSTGRES_USER
              value: langprobe
            # Password is sourced from a Secret the operator generates at
            # bootstrap (openssl rand) — never a committed default. See
            # deploy/k8s/dev-deps/README.md and the GKE bootstrap runbook.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langprobe-db-bootstrap
                  key: postgres_password
            # Keep PGDATA in a subdirectory of the mount so Postgres does not
            # trip over the volume's lost+found on first init.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: pg
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "langprobe", "-d", "langprobe"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: langprobe
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
