---
# In-cluster ClickHouse for the GKE deploy. Runs as a StatefulSet with a
# PersistentVolumeClaim so the trace data survives pod restarts /
# rescheduling — on GKE Autopilot pods are recreated routinely (node
# auto-repair, bin-packing, upgrades), and an emptyDir would silently lose
# every trace on each move. See README.md for the managed-database path.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: langprobe
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: dev-deps
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: dev-deps
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          env:
            - name: CLICKHOUSE_DB
              value: langprobe
            - name: CLICKHOUSE_USER
              value: langprobe
            # Password is sourced from a Secret the operator generates at
            # bootstrap (openssl rand) — never a committed default. See
            # deploy/k8s/dev-deps/README.md and the GKE bootstrap runbook.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langprobe-db-bootstrap
                  key: clickhouse_password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: tcp
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: langprobe
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: tcp
      port: 9000
      targetPort: tcp
