{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "langprobe.scheduler.fullname" . }}
  labels:
    {{- include "langprobe.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  # Recreate: the reaper's UPDATE is idempotent and advisory-locked, so a
  # brief single-replica gap during rollout is safe.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "langprobe.scheduler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "langprobe.scheduler.selectorLabels" . | nindent 8 }}
      {{- with .Values.scheduler.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "langprobe.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          image: {{ include "langprobe.image" (dict "root" . "component" .Values.scheduler) }}
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.image.pullPolicy }}
          env:
            - name: LANGPROBE_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            {{- include "langprobe.envFromSecret" (dict "cfg" .Values.postgres "name" "LANGPROBE_PG_DSN") | nindent 12 }}
            {{- include "langprobe.envFromSecret" (dict "cfg" .Values.clickhouse "name" "LANGPROBE_CLICKHOUSE_URL") | nindent 12 }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
