name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: install python
        run: uv python install 3.11
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format check
        run: uvx ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: langprobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Integration tests are DSN-gated: this is what un-skips them. No
      # ClickHouse — the correctness suites (advisory locks, tenant columns,
      # exactly-once scoring, alert-evaluator lock) fake ClickHouse and only
      # need a real Postgres.
      LANGPROBE_TEST_DSN: postgresql://pg:pg@localhost:5432/langprobe
      PGPASSWORD: pg
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: install python
        run: uv python install 3.11
      - name: apply postgres migrations
        # No migration-runner in-repo yet; apply the ordered SQL directly,
        # same as the local test workflow. ON_ERROR_STOP so a bad migration
        # fails the job instead of silently continuing.
        run: |
          for f in $(ls schemas/postgres/migrations/*.sql | sort); do
            echo "applying $f"
            psql -h localhost -U pg -d langprobe -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: pytest — scheduler + api
        run: |
          uv run --project services/scheduler pytest services/scheduler/tests -q
          uv run --project services/api pytest services/api/tests -q

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: install
        run: pnpm install --frozen-lockfile=false
      - name: lint
        run: pnpm -r --if-present lint
      - name: typecheck
        run: pnpm -r --if-present typecheck

  dco:
    name: dco
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base".."$head"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: '; then
              echo "::error::commit $sha missing Signed-off-by"
              missing=1
            fi
          done
          exit $missing
